<style>

html,
body {
    width: 100%;
    height: 100%;

}
<!-- 010 -->
body {

}
<!-- 011 -->
canvas {
    display: block;

}

    border-radius: 20px;
    background: rgba(0,0,0,0.55);
    color: white;
    font-family: -apple-system, BlinkMacSystemFont, sans-serif;
    font-size: 13px;
    pointer-events: none;
    white-space: nowrap;
}
<!-- 013 -->
#hint {
    position: fixed;
    left: 50%;
    bottom: calc(env(safe-area-inset-bottom) + 18px);
    transform: translateX(-50%);
    z-index: 10;
    padding: 10px 16px;
    border-radius: 22px;
    background: rgba(0,0,0,0.48);
    color: white;
    font-family: -apple-system, BlinkMacSystemFont, sans-serif;

<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover"
    >
    <title>Tree Memory</title>
    <style>
        html,
        body {
            width: 100%;
            height: 100%;
            margin: 0;
            padding: 0;
            overflow: hidden;
            background: #10130f;
        }
        #application {
            display: block;
            width: 100%;
            height: 100%;
            touch-action: none;
        }
        #status {
            position: fixed;
            top: 16px;
            left: 16px;
            z-index: 10;
            padding: 8px 12px;
            border-radius: 8px;
            background: rgba(0, 0, 0, 0.65);
            color: white;
            font-family: Arial, sans-serif;
            font-size: 13px;
        }
    </style>
</head>
<body>
<canvas id="application"></canvas>
<div id="status">Запуск PlayCanvas…</div>
<script type="module" src="./src/main.js"></script>
</body>
</html>

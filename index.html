<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover"
    >
    <meta
        name="theme-color"
        content="#10130f"
    >
    <title>Tree Memory</title>
    <style>
        html,
        body {
            width: 100%;
            height: 100%;
            margin: 0;
            padding: 0;
            overflow: hidden;
            background: #10130f;
        }
        body {
            position: fixed;
            inset: 0;
            overscroll-behavior: none;
            -webkit-user-select: none;
            user-select: none;
            -webkit-touch-callout: none;
        }
        #application {
            position: fixed;
            inset: 0;
            display: block;
            width: 100%;
            height: 100%;
            outline: none;
            touch-action: none;
            -webkit-tap-highlight-color: transparent;
        }
        #status {
            position: fixed;
            top: max(
                12px,
                env(safe-area-inset-top)
            );
            left: 12px;
            right: 12px;
            z-index: 1000;
            box-sizing: border-box;
            padding: 10px 12px;
            border-radius: 10px;
            background: rgba(0, 0, 0, 0.78);
            color: #fff;
            font-family:
                -apple-system,
                BlinkMacSystemFont,
                "Segoe UI",
                Arial,
                sans-serif;
            font-size: 13px;
            line-height: 1.35;
            text-align: center;
            pointer-events: none;
            backdrop-filter: blur(8px);
            -webkit-backdrop-filter: blur(8px);
        }
    </style>
</head>
<body>
<canvas
    id="application"
    aria-label="Игровая сцена"
></canvas>
<div
    id="status"
    aria-live="polite"
>
    Загрузка игрового ядра…
</div>
<script
    type="module"
    src="./src/main.js"
></script>
</body>
</html>

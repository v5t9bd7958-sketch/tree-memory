<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover"
    >
    <meta name="theme-color" content="#0b0d0a">
    <title>Дерево, которое помнит — TEST 02</title>
    <script type="importmap">
    {
        "imports": {
            "playcanvas": "https://cdn.jsdelivr.net/npm/playcanvas/+esm"
        }
    }
    </script>
    <style>
        html,
        body {
            width: 100%;
            height: 100%;
            margin: 0;
            padding: 0;
            overflow: hidden;
            background: #0b0d0a;
            touch-action: none;
            -webkit-user-select: none;
            user-select: none;
        }
        body {
            position: fixed;
            inset: 0;
        }
        #application {
            position: fixed;
            inset: 0;
            display: block;
            width: 100%;
            height: 100%;
            margin: 0;
            padding: 0;
            outline: none;
            touch-action: none;
        }
        #status {
            position: fixed;
            z-index: 10;
            top: calc(env(safe-area-inset-top) + 12px);
            left: 50%;
            transform: translateX(-50%);
            padding: 8px 14px;
            border-radius: 18px;
            background: rgba(0, 0, 0, 0.55);
            color: #ffffff;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
            font-size: 13px;
            line-height: 1.2;
            white-space: nowrap;
            pointer-events: none;
        }
        #hint {
            position: fixed;
            z-index: 10;
            left: 50%;
            bottom: calc(env(safe-area-inset-bottom) + 18px);
            transform: translateX(-50%);
            padding: 10px 16px;
            border-radius: 22px;
            background: rgba(0, 0, 0, 0.52);
            color: #ffffff;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
            font-size: 14px;
            line-height: 1.2;
            white-space: nowrap;
            pointer-events: none;
        }
    </style>
</head>
<body>
    <div id="status">Загрузка 3D runtime…</div>
    <div id="hint">Тапни по светящемуся объекту</div>
    <canvas id="application"></canvas>
    <script type="module" src="./src/main.js"></script>
</body>
</html>
